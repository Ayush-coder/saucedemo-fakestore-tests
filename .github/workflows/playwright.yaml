name: Core Engineering Automation Pipeline
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 18
        
    - name: Install Project Dependencies
      run: npm install

    - name: Install Playwright Library Package
      run: npm install -D @playwright/test
      
    - name: Install Headless Playwright Browsers
      run: npx playwright install --with-deps

    - name: Execute UI Framework Suite (Playwright)
      run: npm run test:ui
      
    # "continue-on-error: true" ensures that if your local API endpoints fail, 
    # the pipeline logs the failure but keeps going to generate the full reports.
    - name: Execute API Framework Suite (Jest)
      continue-on-error: true
      run: npm test
      
    - name: Archive Test Execution Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-reports
        path: |
          playwright-report/
          junit.xml
        retention-days: 30
